<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — OD Socials</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
  html, body { height: 100%; }
  body {
    margin: 0; background: #0A0D14; color: #F7F4ED;
    font-family: Archivo, system-ui, sans-serif;
    display: grid; place-items: center; text-align: center; padding: 24px;
  }
  .code { font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.22em; text-transform: uppercase; color: #A99BF5; margin: 0 0 20px; }
  h1 { margin: 0 0 16px; font-size: clamp(34px, 7vw, 64px); font-weight: 800; letter-spacing: -0.02em; }
  p { margin: 0 0 32px; font-size: 16px; line-height: 1.6; color: rgba(247,244,237,0.7); max-width: 40ch; }
  a { display: inline-block; padding: 14px 28px; border: 1px solid #A99BF5; border-radius: 999px; color: #F7F4ED; text-decoration: none; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; transition: background 200ms ease, color 200ms ease; }
  a:hover { background: #A99BF5; color: #0A0D14; }
</style>
</head>
<body>
  <main>
    <p class="code">Error 404</p>
    <h1>This page moved on.</h1>
    <p>The link you followed does not lead anywhere. Everything else is still where you left it.</p>
    <a href="/">Back to the homepage</a>
  </main>
</body>
</html>
